<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Oh No, Thello!</title>
<style>
  html, body { margin: 0; background: #111; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; max-width: 100vmin; max-height: 100vmin; }
  #log { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="480" height="480"></canvas>
<pre id="log"></pre>
<script type="text/javascript" src="odin.js"></script>
<script>
  const cv = document.getElementById("screen");
  const g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  const css = (r, gg, b, a) => `rgba(${r * 255 | 0},${gg * 255 | 0},${b * 255 | 0},${a})`;
  const canvas = {
    clear_canvas: (r, gg, b) => { g.fillStyle = css(r, gg, b, 1); g.fillRect(0, 0, cv.width, cv.height); },
    fill_rect: (x, y, w, h, r, gg, b, a) => { g.fillStyle = css(r, gg, b, a); g.fillRect(x, y, w, h); },
  };
  odin.runWasm("game.wasm", document.getElementById("log"), { canvas });
</script>
</body>
</html>
